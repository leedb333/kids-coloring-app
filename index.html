<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><meta name="description" content="터치로 색칠하고 손가락으로 그리는 어린이 색칠놀이터"><title>알록달록 색칠놀이터</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><script defer src="./app.js"></script></head>
<body><header><a class="brand" href="./" aria-label="알록달록 색칠놀이터 홈"><span class="brand-icon">✿</span><span>알록달록 <b>색칠놀이터</b></span></a><span class="header-note">작은 손으로 만드는 큰 상상 ✨</span><button id="install" hidden>＋ 앱 설치</button></header>
<main><section id="home"><div class="intro"><span class="eyebrow">오늘은 어떤 색으로 놀까?</span><h1>내가 만드는 <span>알록달록 세상</span></h1><p>좋아하는 그림을 골라봐! 색칠놀이를 시작하자.</p></div><div id="cards" class="cards"></div><div class="home-tip"><span>🎨</span><div><strong>톡! 칠하고, 쓱! 그려요</strong><p>색을 고르고 그림을 톡 누르면 색이 채워져요.</p></div></div><p class="privacy">광고 없이 · 로그인 없이 · 그림은 이 기기에만</p></section>
<section id="studio" hidden><div class="studio-bar"><button id="home-button">⌂ 그림 고르기</button><div><h1 id="drawing-name"></h1><p id="hint">색을 고르고 그림을 톡 눌러봐!</p></div><button id="save" class="save">↓ 그림 저장</button></div><div class="workspace"><aside class="tools"><h2>어떻게 칠할까?</h2><div class="modes"><button id="fill" aria-pressed="true">▨<span>색 채우기</span></button><button id="draw" aria-pressed="false">✎<span>자유 그리기</span></button></div><h2>색을 골라봐</h2><div id="palette" class="palette"></div><div class="width-control"><label for="brush">붓 크기 <output id="brush-value">12</output></label><input id="brush" type="range" min="4" max="32" value="12" step="4"></div><div class="actions"><button id="undo">↶ 되돌리기</button><button id="reset">↻ 처음부터</button></div></aside><div class="paper-wrap"><div id="paper" class="paper" aria-label="색칠 종이"></div><span class="paper-caption">마음껏 칠해도 괜찮아 ♡</span></div></div></section></main>
<p id="status" role="status" aria-live="polite"></p><dialog id="reset-dialog"><h2>새로 색칠할까?</h2><p>지금 그림이 하얗게 바뀌어요.<br>되돌리기로 다시 가져올 수 있어요.</p><div><button id="cancel-reset">계속 색칠하기</button><button id="confirm-reset" class="save">새로 시작</button></div></dialog></body></html>
